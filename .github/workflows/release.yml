name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vsce package --no-dependencies --out aura-datadock.vsix
      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath aura-datadock.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: npx ovsx publish aura-datadock.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Attach package to GitHub release
        run: gh release create "$GITHUB_REF_NAME" aura-datadock.vsix --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
